<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard — Kairozen SMM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #0088FF;
      --blue-dark: #0066CC;
      --blue-soft: #e8f4ff;
      --bg: #f0f4f8;
      --card: #ffffff;
      --ink: #1a2332;
      --muted: #64748b;
      --line: #e2e8f0;
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    a { color: var(--blue); text-decoration: none; }

    /* ===== HEADER (white bar like screenshot) ===== */
    .header {
      position: sticky; top: 0; z-index: 40;
      background: #fff;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .menu-toggle {
      width: 40px; height: 40px; border: 0; border-radius: 10px;
      background: transparent; color: var(--blue);
      font-size: 22px; cursor: pointer; display: grid; place-items: center;
    }
    .header .brand {
      font-weight: 800; font-size: 1.05rem; color: var(--blue);
      letter-spacing: -.02em;
    }
    .header .spacer { flex: 1; }
    .header .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--blue); color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 12px;
      border: 2px solid var(--blue-soft);
    }

    /* ===== SIDEBAR DRAWER (blue like screenshot) ===== */
    .drawer-bg {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none; transition: .25s;
    }
    .drawer-bg.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
      width: min(300px, 85vw);
      background: var(--blue);
      color: #fff;
      transform: translateX(-105%);
      transition: transform .28s ease;
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-close {
      position: absolute; top: 12px; right: 12px;
      width: 36px; height: 36px; border-radius: 50%;
      border: 0; background: rgba(255,255,255,.2);
      color: #fff; font-size: 18px; cursor: pointer;
    }
    .drawer-user {
      margin: 48px 16px 16px;
      background: #fff; border-radius: 16px;
      padding: 20px 16px; text-align: center; color: var(--ink);
    }
    .drawer-user .logo-circle {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--blue-soft); color: var(--blue);
      display: grid; place-items: center; margin: 0 auto 12px;
      font-weight: 900; font-size: 18px;
      border: 3px solid var(--blue);
    }
    .drawer-user .bal {
      display: inline-block;
      background: var(--blue); color: #fff;
      font-weight: 800; font-size: 14px;
      padding: 6px 16px; border-radius: 999px; margin-bottom: 6px;
    }
    .drawer-user .uname {
      font-weight: 700; font-size: 15px; color: var(--blue);
    }
    .drawer-nav { padding: 8px 12px 24px; flex: 1; }
    .drawer-nav button {
      width: 100%; text-align: left;
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; border: 0; border-radius: 12px;
      background: transparent; color: #fff;
      font-weight: 600; font-size: 15px; cursor: pointer;
      margin-bottom: 2px;
    }
    .drawer-nav button:hover,
    .drawer-nav button.on {
      background: rgba(255,255,255,.2);
    }
    .drawer-nav .ico { width: 22px; text-align: center; font-size: 16px; }

    /* ===== MAIN ===== */
    .main { padding: 14px 14px 80px; max-width: 720px; margin: 0 auto; }

    /* Stats 2x2 like screenshot */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .stat .icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--blue); color: #fff;
      display: grid; place-items: center; font-size: 18px; flex: none;
    }
    .stat .n { font-weight: 800; font-size: 15px; line-height: 1.2; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Platform chips */
    .platforms {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 14px;
    }
    .platforms button {
      background: #fff; border: 1.5px solid var(--blue);
      border-radius: 12px; padding: 11px 12px;
      font-weight: 600; font-size: 13px; color: var(--ink);
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      justify-content: center;
    }
    .platforms button.on,
    .platforms button:hover {
      background: var(--blue-soft); border-color: var(--blue);
      color: var(--blue);
    }

    /* Order panel */
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      margin-bottom: 14px;
    }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 14px;
    }
    .tabs button {
      padding: 11px; border-radius: 12px; border: 1.5px solid var(--blue);
      background: #fff; color: var(--blue);
      font-weight: 700; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tabs button.on {
      background: linear-gradient(135deg, var(--blue), #5b5bff);
      color: #fff; border-color: transparent;
    }

    label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: var(--ink);
      margin-bottom: 6px;
    }
    .field { margin-bottom: 12px; }
    input, select {
      width: 100%; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--line);
      background: #f8fafc; color: var(--ink); font-size: 14px;
    }
    input:focus, select:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,136,255,.15);
      background: #fff;
    }
    .svc-chip {
      display: flex; align-items: center; gap: 8px;
      background: #f8fafc; border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; font-size: 13px;
    }
    .svc-id {
      background: #f59e0b; color: #fff;
      font-weight: 800; font-size: 11px;
      padding: 3px 8px; border-radius: 6px; flex: none;
    }
    .charge-box {
      background: var(--blue-soft);
      border-radius: 12px; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .charge-box .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
    .charge-box .val { font-size: 1.2rem; font-weight: 800; color: var(--blue); }

    .btn-primary {
      width: 100%; padding: 14px;
      border: 0; border-radius: 12px;
      background: var(--blue); color: #fff;
      font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary:disabled { opacity: .5; }
    .btn-ghost {
      padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff;
      font-weight: 600; font-size: 12px; cursor: pointer; color: var(--ink);
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 700; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
    }
    .badge.processing { background: #fef3c7; color: #b45309; }
    .badge.completed, .badge.paid { background: #dcfce7; color: #15803d; }
    .badge.pending { background: #e0f2fe; color: #0369a1; }
    .badge.failed, .badge.canceled, .badge.partial { background: #fee2e2; color: #b91c1c; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { text-align: center; padding: 32px; color: var(--muted); }

    .qr-box {
      text-align: center; padding: 18px;
      background: #f8fafc; border-radius: 12px;
      border: 1px dashed var(--line); margin-top: 12px;
    }
    .qr-box img { max-width: 200px; margin: 0 auto 10px; border-radius: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff;
      padding: 12px 18px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      opacity: 0; transition: .25s; z-index: 100; pointer-events: none;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; }
    .toast.err { background: #dc2626; }

    .hint { font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 10px; }

    @media (min-width: 900px) {
      .menu-toggle { display: none; }
      .drawer-bg { display: none !important; }
      .drawer {
        position: sticky; top: 57px; transform: none;
        height: calc(100vh - 57px); width: 260px;
        flex: none;
      }
      .layout { display: flex; }
      .main { flex: 1; }
      body.desk .drawer { display: flex; }
    }
  </style>
</head>
<body>
  <header class="header">
    <button class="menu-toggle" id="menuBtn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="brand">Kairozen SMM</div>
    <div class="spacer"></div>
    <div class="avatar" id="avatar">KZ</div>
  </header>

  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="drawer-user">
      <div class="logo-circle">KZ</div>
      <div class="bal" id="balPill">$0.00</div>
      <div class="uname" id="userName">—</div>
    </div>
    <nav class="drawer-nav">
      <button class="on" data-t="new" onclick="tab('new')"><span class="ico" data-icon="cart"></span> New order</button>
      <button data-t="orders" onclick="tab('orders')"><span class="ico" data-icon="list"></span> Orders</button>
      <button data-t="deposit" onclick="tab('deposit')"><span class="ico" data-icon="dollar"></span> Add funds</button>
      <button data-t="services" onclick="tab('services')"><span class="ico" data-icon="grid"></span> Services</button>
      <button data-t="history" onclick="tab('history')"><span class="ico" data-icon="receipt"></span> Transactions</button>
      <button data-t="api" onclick="tab('api')"><span class="ico" data-icon="key"></span> API</button>
      <button onclick="logout()"><span class="ico" data-icon="logout"></span> Logout</button>
    </nav>
  </aside>

  <div class="layout">
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/icons.js"></script>
  <script>
    let user = null, services = [], currentDepId = null, pollTimer = null, filterCat = "";

    function renderStaticIcons() {
      document.querySelectorAll("[data-icon]").forEach(el => {
        el.innerHTML = icon(el.dataset.icon, parseInt(el.dataset.iconSize || "16", 10));
      });
    }
    renderStaticIcons();

    const menuBtn = document.getElementById("menuBtn");
    const drawer = document.getElementById("drawer");
    const drawerBg = document.getElementById("drawerBg");
    const drawerClose = document.getElementById("drawerClose");
    function openDrawer() { drawer.classList.add("open"); drawerBg.classList.add("open"); }
    function closeDrawer() { drawer.classList.remove("open"); drawerBg.classList.remove("open"); }
    menuBtn.onclick = openDrawer;
    drawerClose.onclick = closeDrawer;
    drawerBg.onclick = closeDrawer;

    function toast(msg, err) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show" + (err ? " err" : "");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 3000);
    }

    async function api(path, opts = {}) {
      const r = await fetch("/api/" + path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
      });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { location.href = "/"; throw new Error("Please sign in"); }
      if (!j.success) throw new Error(j.error || "Failed");
      return j;
    }

    function money(n) { return "$" + Number(n || 0).toFixed(2); }
    function fmt(ts) { return ts ? new Date(ts * 1000).toLocaleString() : "—"; }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function setUser(u) {
      user = u;
      document.getElementById("balPill").textContent = money(u.balance);
      document.getElementById("userName").textContent = u.username;
      document.getElementById("avatar").textContent = (u.username || "KZ").slice(0, 2).toUpperCase();
    }

    async function logout() {
      await api("logout", { method: "POST" }).catch(() => {});
      location.href = "/";
    }

    function tab(name) {
      closeDrawer();
      document.querySelectorAll(".drawer-nav button[data-t]").forEach(b =>
        b.classList.toggle("on", b.dataset.t === name)
      );
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      ({ new: renderNew, orders: renderOrders, services: renderServices,
         deposit: renderDeposit, history: renderHistory, api: renderApi })[name]?.();
    }

    async function renderApi() {
      document.getElementById("main").innerHTML = `
        <div class="panel">
          <h2>Your API key</h2>
          <p style="color:var(--muted);font-size:13px;margin-bottom:12px;line-height:1.55">
            Use this key to place orders on our catalogue from your own site, bot or reseller panel —
            same idea as a PerfectPanel-compatible SMM API.
          </p>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
            <input id="apiKeyBox" readonly value="${esc(user.api_key || "")}"
              style="flex:1;min-width:220px;margin:0;font-family:ui-monospace,monospace;font-size:12px" />
            <button class="btn sm ghost" onclick="copyApiKey()">Copy</button>
            <button class="btn sm danger" onclick="regenApiKey()">Regenerate</button>
          </div>
          <h2 style="margin-top:4px">How to use it</h2>
          <p style="color:var(--muted);font-size:13px;line-height:1.7">
            Endpoint: <code class="mono">POST ${location.origin}/api/v2</code><br>
            Send <code>key</code> + <code>action</code> as form fields or JSON body.
          </p>
          <pre style="white-space:pre-wrap;font-size:12px;background:rgba(255,255,255,.04);padding:12px;border-radius:10px;margin-top:8px">curl -X POST ${location.origin}/api/v2 \\
  -d key=${esc(user.api_key || "YOUR_KEY")} \\
  -d action=services

curl -X POST ${location.origin}/api/v2 \\
  -d key=${esc(user.api_key || "YOUR_KEY")} \\
  -d action=add -d service=1 -d link=https://... -d quantity=1000

curl -X POST ${location.origin}/api/v2 \\
  -d key=${esc(user.api_key || "YOUR_KEY")} \\
  -d action=status -d order=123

curl -X POST ${location.origin}/api/v2 \\
  -d key=${esc(user.api_key || "YOUR_KEY")} \\
  -d action=balance</pre>
          <p style="color:var(--muted);font-size:12px;margin-top:10px">
            Actions: <code>services</code> · <code>add</code> · <code>status</code> · <code>multistatus</code> ·
            <code>refill</code> · <code>refill_status</code> · <code>cancel</code> · <code>balance</code>.
            Same request/response shape as the standard SMM Panel API — any existing reseller script or bot
            already built for that API works here unchanged.
            Orders placed via the API are charged to this account's balance, exactly like orders placed here.
          </p>
        </div>`;
    }

    function copyApiKey() {
      const box = document.getElementById("apiKeyBox");
      box.select();
      navigator.clipboard?.writeText(box.value).then(() => toast("Copied")).catch(() => toast("Copy failed", true));
    }

    async function regenApiKey() {
      if (!confirm("Regenerate your API key? Any integration using the old key will stop working.")) return;
      try {
        const r = await api("me/apikey", { method: "POST" });
        setUser(r.user);
        renderApi();
        toast("New API key generated");
      } catch (e) { toast(e.message, true); }
    }

    const PLATFORM_ICONS = {
      TikTok: icon("music", 16), Instagram: icon("instagram", 16), YouTube: icon("play", 16),
      Facebook: icon("facebook", 16), Telegram: icon("send", 16), "Twitter / X": icon("twitter", 16),
      Spotify: icon("headphones", 16)
    };
    const PREFERRED_ORDER = ["TikTok", "Instagram", "YouTube", "Facebook", "Telegram", "Twitter / X", "Spotify"];

    async function renderNew() {
      if (!services.length) {
        try { services = (await api("services")).services || []; }
        catch (e) { toast(e.message, true); }
      }
      const rawCats = [...new Set(services.map(s => s.category))];
      const cats = [
        ...PREFERRED_ORDER.filter(c => rawCats.includes(c)),
        ...rawCats.filter(c => !PREFERRED_ORDER.includes(c))
      ];
      const filtered = filterCat
        ? services.filter(s => s.category === filterCat)
        : services;

      document.getElementById("main").innerHTML = `
        <div class="stats">
          <div class="stat">
            <div class="icon">${icon("user",20)}</div>
            <div><div class="n">${esc(user.username)}</div><div class="l">Username</div></div>
          </div>
          <div class="stat">
            <div class="icon">${icon("dollar",20)}</div>
            <div><div class="n">${money(user.balance)}</div><div class="l">Balance</div></div>
          </div>
          <div class="stat">
            <div class="icon">${icon("barchart",20)}</div>
            <div><div class="n" id="spendStat">—</div><div class="l">Total Spend</div></div>
          </div>
          <div class="stat">
            <div class="icon">${icon("cart",20)}</div>
            <div><div class="n" id="ordersStat">—</div><div class="l">Orders</div></div>
          </div>
        </div>

        <div class="platforms">
          <button type="button" class="${!filterCat ? "on" : ""}" onclick="setFilter('')">${icon("globe",14)} All</button>
          ${cats.slice(0, 5).map(c => `
            <button type="button" class="${filterCat === c ? "on" : ""}" onclick="setFilter('${esc(c)}')">
              ${PLATFORM_ICONS[c] || icon("hash",14)} ${esc(c)}
            </button>`).join("")}
        </div>

        <div class="panel">
          <div class="tabs">
            <button class="on" type="button">${icon("cart",14)} New Order</button>
            <button type="button" onclick="tab('services')">${icon("heart",14)} Services</button>
          </div>

          <div class="field">
            <label>${icon("grid",14)} Category</label>
            <select id="cat" onchange="onCatChange()">
              <option value="">All categories</option>
              ${cats.map(c => `<option value="${esc(c)}" ${filterCat===c?"selected":""}>${esc(c)}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>${icon("list",14)} Service</label>
            <select id="svc" onchange="onSvcChange()">
              <option value="">Select service</option>
              ${filtered.map(s => `
                <option value="${s.id}" data-rate="${s.rate}" data-min="${s.min}" data-max="${s.max}" data-name="${esc(s.name)}" data-cat="${esc(s.category)}">
                  ${s.id} — ${esc(s.name)}
                </option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>${icon("link",14)} Link</label>
            <input id="link" placeholder="https://… or @username" />
          </div>
          <div class="field">
            <label>${icon("hash",14)} Quantity</label>
            <input type="number" id="qty" min="1" placeholder="1000" oninput="calcCost()" />
          </div>
          <p class="hint" id="rangeHint">Select a service to see min / max</p>
          <div class="charge-box">
            <span class="lbl">Charge</span>
            <span class="val" id="cost">$0.00</span>
          </div>
          <button class="btn-primary" onclick="placeOrder()">Submit order</button>
        </div>`;

      // load order stats
      api("orders").then(r => {
        const list = r.orders || [];
        const spend = list.reduce((a, o) => a + Number(o.charge || 0), 0);
        const el1 = document.getElementById("spendStat");
        const el2 = document.getElementById("ordersStat");
        if (el1) el1.textContent = money(spend);
        if (el2) el2.textContent = list.length;
      }).catch(() => {});
    }

    function setFilter(cat) {
      filterCat = cat;
      renderNew();
    }

    function onCatChange() {
      filterCat = document.getElementById("cat").value;
      renderNew();
    }

    function onSvcChange() {
      const opt = document.getElementById("svc").selectedOptions[0];
      const hint = document.getElementById("rangeHint");
      if (!opt || !opt.value) {
        hint.textContent = "Select a service to see min / max";
        calcCost();
        return;
      }
      hint.textContent = `Min ${opt.dataset.min} · Max ${opt.dataset.max} · $${Number(opt.dataset.rate).toFixed(2)}/1k`;
      document.getElementById("qty").min = opt.dataset.min;
      document.getElementById("qty").max = opt.dataset.max;
      calcCost();
    }

    function calcCost() {
      const opt = document.getElementById("svc")?.selectedOptions?.[0];
      const qty = parseInt(document.getElementById("qty")?.value, 10) || 0;
      const el = document.getElementById("cost");
      if (!el) return;
      if (!opt?.value || !qty) { el.textContent = "$0.00"; return; }
      el.textContent = "$" + ((qty / 1000) * parseFloat(opt.dataset.rate)).toFixed(4);
    }

    async function placeOrder() {
      const service_id = parseInt(document.getElementById("svc").value, 10);
      const quantity = parseInt(document.getElementById("qty").value, 10);
      const link = document.getElementById("link").value.trim();
      if (!service_id) return toast("Select a service", true);
      if (!quantity) return toast("Enter quantity", true);
      if (!link) return toast("Enter link", true);
      try {
        const r = await api("orders", { method: "POST", body: { service_id, quantity, link } });
        setUser(r.user);
        toast("Order #" + r.order.id + " placed!");
        tab("orders");
      } catch (e) { toast(e.message, true); }
    }

    async function renderOrders() {
      document.getElementById("main").innerHTML = `<div class="panel"><div class="empty">Loading…</div></div>`;
      try {
        const list = (await api("orders")).orders || [];
        document.getElementById("main").innerHTML = `
          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <strong style="font-size:16px">Orders</strong>
              <button class="btn-ghost" onclick="renderOrders()">Refresh</button>
            </div>
            ${list.length ? `<div style="overflow-x:auto"><table>
              <thead><tr><th>ID</th><th>Service</th><th>Qty</th><th>Charge</th><th>Status</th><th>Date</th></tr></thead>
              <tbody>${list.map(o => `
                <tr>
                  <td class="mono">#${o.id}</td>
                  <td>${esc(o.service_name)}</td>
                  <td>${o.quantity}</td>
                  <td class="mono">${money(o.charge)}</td>
                  <td><span class="badge ${esc(o.status)}">${esc(o.status)}</span></td>
                  <td>${fmt(o.created_at)}</td>
                </tr>`).join("")}
              </tbody></table></div>` : `<div class="empty">No orders yet</div>`}
          </div>`;
      } catch (e) { toast(e.message, true); }
    }

    async function renderServices() {
      if (!services.length) {
        try { services = (await api("services")).services || []; }
        catch (e) { toast(e.message, true); }
      }
      const byCat = {};
      services.forEach(s => (byCat[s.category] = byCat[s.category] || []).push(s));
      document.getElementById("main").innerHTML = `
        <div class="panel">
          <strong style="font-size:16px">Services (${services.length})</strong>
          ${Object.keys(byCat).map(cat => `
            <div style="margin-top:16px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase">${esc(cat)}</div>
            <table>
              <thead><tr><th>ID</th><th>Name</th><th>Rate</th><th>Min</th><th>Max</th></tr></thead>
              <tbody>${byCat[cat].map(s => `
                <tr>
                  <td class="mono">${s.id}</td>
                  <td>${esc(s.name)}</td>
                  <td class="mono" style="color:var(--blue)">${money(s.rate)}</td>
                  <td>${s.min}</td>
                  <td>${s.max}</td>
                </tr>`).join("")}
              </tbody>
            </table>`).join("")}
        </div>`;
    }

    function renderDeposit() {
      document.getElementById("main").innerHTML = `
        <div class="panel" style="max-width:420px;margin:0 auto">
          <strong style="font-size:16px">Add funds</strong>
          <p class="muted" style="margin:8px 0 14px;line-height:1.5">Minimum $0.50. Demo auto-credits after ~8s.</p>
          <div class="field">
            <label>Amount (USD)</label>
            <input type="number" id="depAmount" min="0.5" step="0.5" value="5" />
          </div>
          <button class="btn-primary" id="depBtn" onclick="startDeposit()">Continue</button>
          <div id="depResult"></div>
        </div>`;
    }

    async function startDeposit() {
      const amount = parseFloat(document.getElementById("depAmount").value);
      if (!amount || amount < 0.5) return toast("Minimum $0.50", true);
      const btn = document.getElementById("depBtn");
      btn.disabled = true;
      try {
        const r = await api("deposit", { method: "POST", body: { amount } });
        currentDepId = r.deposit_id;
        document.getElementById("depResult").innerHTML = `
          <div class="qr-box">
            ${r.qr_image ? `<img src="${r.qr_image}" alt="QR" />` : `<div style="font-size:40px">${icon("smartphone",40)}</div>`}
            <div style="font-weight:800;font-size:1.25rem;color:var(--blue);margin-top:8px">${money(r.amount)}</div>
            <p class="muted" style="margin-top:6px">${esc(r.hint || "")}</p>
            <p class="muted">#${r.deposit_id}${r.demo ? " · Demo" : ""}</p>
            <p id="depStatus" style="margin-top:10px;font-weight:700;color:var(--warn)">Waiting…</p>
          </div>`;
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(checkDeposit, 2500);
        setTimeout(checkDeposit, 400);
      } catch (e) { toast(e.message, true); }
      finally { btn.disabled = false; }
    }

    async function checkDeposit() {
      if (!currentDepId) return;
      try {
        const r = await api("deposit/check", { method: "POST", body: { deposit_id: currentDepId } });
        if (r.paid) {
          clearInterval(pollTimer); pollTimer = null;
          setUser(r.user);
          const st = document.getElementById("depStatus");
          if (st) { st.style.color = "var(--ok)"; st.innerHTML = icon("check",14) + " Paid"; }
          toast("Balance updated!");
          currentDepId = null;
        }
      } catch (_) {}
    }

    async function renderHistory() {
      document.getElementById("main").innerHTML = `<div class="panel"><div class="empty">Loading…</div></div>`;
      try {
        const list = (await api("deposits")).deposits || [];
        document.getElementById("main").innerHTML = `
          <div class="panel">
            <strong style="font-size:16px">Transactions</strong>
            ${list.length ? `<table style="margin-top:12px">
              <thead><tr><th>ID</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
              <tbody>${list.map(d => `
                <tr>
                  <td class="mono">#${d.id}</td>
                  <td class="mono">${money(d.amount)}</td>
                  <td><span class="badge ${esc(d.status)}">${esc(d.status)}</span></td>
                  <td>${fmt(d.created_at)}</td>
                </tr>`).join("")}
              </tbody></table>` : `<div class="empty">No transactions</div>`}
          </div>`;
      } catch (e) { toast(e.message, true); }
    }

    (async () => {
      try {
        setUser((await api("me")).user);
        services = (await api("services")).services || [];
        tab("new");
      } catch (_) { location.href = "/"; }
    })();
  </script>
</body>
</html>
